Volume = 80
AudioFreq = 48000
AudioChannels = 2
AudioSamples = 512

[KeyMap]
Controls = Up, Down, Left, Right, Right Shift, Return, x, z, s, a, c, v
Pause = p
Save = Shift+F1
Load = F1

