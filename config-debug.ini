[General]
Autosave = 0
DisableFrameDelay = 0
RunAhead = 0

[Graphics]
VSync = 1
OutputMethod = SDL
WindowSize = 1344x672
WindowScale = 3
Fullscreen = 0
NewRenderer = 1
IgnoreAspectRatio = 0
NoSpriteLimits = 0

[Sound]
